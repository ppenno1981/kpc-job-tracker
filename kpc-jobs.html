<!DOCTYPE html>
<title>KPC Job Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">

<style>
/* Layout: full-width kanban with sticky header, sidebar for order entry */
:root {
  --bg: #f0f2f5;
  --surface: #ffffff;
  --surface2: #f8f9fb;
  --border: #e2e6ea;
  --fg: #1a2332;
  --fg2: #5a6778;
  --fg3: #8c99a8;
  --accent: #1d6fa4;
  --accent-light: #e8f3fb;
  --accent-dark: #155682;
  --danger: #c0392b;
  --warn: #e67e22;
  --success: #27ae60;
  --steel: #2c3e50;
  --radius: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.1);
  color-scheme: light;

  /* Stage colors */
  --c-quote: #7f8c8d;
  --c-fab: #e67e22;
  --c-galv: #8e44ad;
  --c-order: #2980b9;
  --c-fit: #16a085;
  --c-ready: #27ae60;
  --c-done: #95a5a6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1621;
    --surface: #1a2332;
    --surface2: #1e2a3a;
    --border: #2a3a4e;
    --fg: #e8edf2;
    --fg2: #9aaabb;
    --fg3: #5a6e82;
    --accent: #3a9fd6;
    --accent-light: #1a3550;
    --accent-dark: #5ab8e8;
    --steel: #c5d0da;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1621; --surface: #1a2332; --surface2: #1e2a3a;
  --border: #2a3a4e; --fg: #e8edf2; --fg2: #9aaabb; --fg3: #5a6e82;
  --accent: #3a9fd6; --accent-light: #1a3550; --accent-dark: #5ab8e8; --steel: #c5d0da;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--fg);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  padding-left: max(0px, env(safe-area-inset-left,0px));
  padding-right: max(0px, env(safe-area-inset-right,0px));
}

/* ── Header ── */
.header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 100;
  background: var(--steel);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 max(16px, env(safe-area-inset-left,0px));
  height: 56px;
  color: #fff;
}
.header-logo {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 17px;
  letter-spacing: -.3px;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 8px;
}
.header-logo svg { opacity: .9 }
.header-sub { font-size: 12px; opacity: .6; margin-top: 1px }
.header-actions { margin-left: auto; display: flex; gap: 8px; align-items: center }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: .15s;
  font-family: inherit;
}
.btn-primary { background: var(--accent); color: #fff }
.btn-primary:hover { background: var(--accent-dark) }
.btn-ghost { background: rgba(255,255,255,.12); color: #fff }
.btn-ghost:hover { background: rgba(255,255,255,.2) }
.btn-sm { padding: 4px 10px; font-size: 12px }
.btn-danger { background: var(--danger); color: #fff }

/* ── Stats bar ── */
.stats-bar {
  display: flex;
  gap: 1px;
  background: var(--border);
  border-bottom: 1px solid var(--border);
}
.stat-cell {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 8px;
  background: var(--surface);
  font-size: 11px;
  color: var(--fg2);
  font-weight: 500;
  letter-spacing: .3px;
  text-transform: uppercase;
}
.stat-cell .num {
  font-size: 22px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--fg);
  line-height: 1.1;
}
.stat-cell .num.money { font-size: 16px }

/* ── Main layout ── */
.main { display: flex; height: calc(100vh - 56px - 54px); overflow: hidden }

/* ── Kanban ── */
.kanban-wrap { flex: 1; overflow-x: auto; overflow-y: hidden; padding: 16px; display: flex; gap: 12px; }
.lane {
  flex: 0 0 230px;
  display: flex;
  flex-direction: column;
  max-height: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.lane-header {
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  font-size: 12px;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--fg2);
  flex-shrink: 0;
}
.lane-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.lane-count {
  margin-left: auto;
  background: var(--border);
  color: var(--fg3);
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 10px;
  font-weight: 700;
}
.lane-cards { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }

/* ── Job Card ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 11px 12px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: box-shadow .15s, transform .1s;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
}
.card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px) }
.card-ref { font-size: 11px; color: var(--fg3); font-weight: 600; letter-spacing: .3px; }
.card-name { font-weight: 600; font-size: 13px; margin: 2px 0; color: var(--fg); }
.card-trailer { font-size: 11px; color: var(--fg2); margin-bottom: 6px; }
.card-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 4px;
  letter-spacing: .2px;
}
.chip-person { background: var(--accent-light); color: var(--accent); }
.chip-task { background: var(--border); color: var(--fg2); }
.chip-overdue { background: #fde8e6; color: var(--danger); }
.chip-deposit { background: #e8f8ef; color: var(--success); }
.chip-balance { background: #fef3e2; color: var(--warn); }
.card-date { font-size: 10px; color: var(--fg3); margin-top: 4px; }

/* ── Side Panel ── */
.panel {
  width: 380px;
  flex-shrink: 0;
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel[hidden] { display: none }
.panel-header {
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.panel-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; }
.panel-body { flex: 1; overflow-y: auto; padding: 20px; }
.panel-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }

/* ── Forms ── */
.form-group { margin-bottom: 14px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
label { display: block; font-size: 11px; font-weight: 600; color: var(--fg2); margin-bottom: 4px; letter-spacing: .3px; text-transform: uppercase; }
input, select, textarea {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  color: var(--fg);
  background: var(--bg);
  transition: border-color .15s;
  outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 60px; }
.section-heading {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--fg3);
  margin: 20px 0 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.section-heading:first-child { margin-top: 0; }

/* Tasks checklist */
.task-list { display: flex; flex-direction: column; gap: 4px; }
.task-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface2);
  font-size: 12px;
}
.task-item input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
.task-item label { font-size: 12px; color: var(--fg); font-weight: 500; text-transform: none; letter-spacing: 0; margin: 0; cursor: pointer; flex: 1; }
.task-item label.done { text-decoration: line-through; color: var(--fg3); }
.task-assign { font-size: 11px; color: var(--fg3); background: var(--border); padding: 1px 6px; border-radius: 4px; white-space: nowrap; }

/* Stage buttons */
.stage-row { display: flex; gap: 6px; flex-wrap: wrap; }
.stage-btn {
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .3px;
  border: 2px solid transparent;
  cursor: pointer;
  transition: .15s;
  font-family: inherit;
}
.stage-btn.active { border-color: currentColor; }

/* Activity log */
.activity { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.activity-entry {
  font-size: 11px;
  color: var(--fg2);
  padding: 6px 10px;
  background: var(--surface2);
  border-radius: 6px;
  border-left: 2px solid var(--border);
}
.activity-time { font-size: 10px; color: var(--fg3); display: block; margin-top: 2px; }
.note-add { display: flex; gap: 8px; margin-top: 8px; }
.note-add input { flex: 1; }

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-overlay[hidden] { display: none }
.modal {
  background: var(--surface);
  border-radius: 12px;
  width: 100%;
  max-width: 540px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
.modal-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; }
.modal-body { flex: 1; overflow-y: auto; padding: 24px; }
.modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }
.close-btn { background: none; border: none; cursor: pointer; color: var(--fg3); font-size: 20px; padding: 2px 6px; border-radius: 4px; line-height: 1; }
.close-btn:hover { background: var(--border); color: var(--fg); }

/* Money display */
.money-box {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 12px;
}
.money-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; font-size: 13px; }
.money-row .label { color: var(--fg2); }
.money-row .val { font-weight: 700; font-variant-numeric: tabular-nums; }
.money-row.total { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; font-size: 14px; }
.money-row.total .label { font-weight: 700; }
.text-success { color: var(--success); }
.text-warn { color: var(--warn); }
.text-danger { color: var(--danger); }

/* Tabs */
.tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.tab-btn {
  padding: 8px 14px;
  font-size: 12px;
  font-weight: 600;
  color: var(--fg3);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  font-family: inherit;
  transition: .15s;
  margin-bottom: -1px;
}
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-pane[hidden] { display: none }

/* People view */
.people-grid { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.person-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.person-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
}
.person-avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  color: #fff;
  flex-shrink: 0;
}
.person-name { font-weight: 700; font-size: 14px; }
.person-role { font-size: 11px; color: var(--fg3); }
.person-jobs { padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.person-job-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  padding: 5px 8px;
  border-radius: 6px;
  background: var(--surface2);
}
.person-job-ref { color: var(--fg3); font-weight: 600; font-size: 11px; min-width: 55px; }
.person-job-name { flex: 1; color: var(--fg); font-weight: 500; }
.person-task { font-size: 10px; color: var(--fg2); background: var(--border); padding: 1px 6px; border-radius: 4px; }

/* Empty state */
.empty { text-align: center; padding: 24px 12px; color: var(--fg3); font-size: 12px; }
.empty svg { opacity: .3; margin-bottom: 8px; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Mobile */
@media (max-width: 700px) {
  .panel { width: 100%; position: fixed; inset: 0; z-index: 150; border-left: none; }
  .stats-bar .stat-cell .num.money { font-size: 13px; }
  .stats-bar { overflow-x: auto; }
  .stat-cell { min-width: 90px; }
}
</style>

<!-- New Job Modal -->
<div class="modal-overlay" id="newJobModal" hidden>
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">New Job</span>
      <button class="close-btn" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="newJobBody">
      <div class="section-heading">Customer</div>
      <div class="form-row">
        <div class="form-group">
          <label for="cust-name">Customer Name</label>
          <input id="cust-name" placeholder="e.g. John Smith">
        </div>
        <div class="form-group">
          <label for="cust-phone">Phone</label>
          <input id="cust-phone" type="tel" placeholder="07700 000000">
        </div>
      </div>
      <div class="form-group">
        <label for="cust-email">Email</label>
        <input id="cust-email" type="email" placeholder="customer@email.com">
      </div>

      <div class="section-heading">Trailer</div>
      <div class="form-row">
        <div class="form-group">
          <label for="trailer-type">Trailer Type</label>
          <select id="trailer-type">
            <option value="">Select type…</option>
            <option>Flatbed Trailer</option>
            <option>Box Trailer</option>
            <option>Plant Trailer</option>
            <option>Car Transporter</option>
            <option>Horse Box</option>
            <option>Tipper Trailer</option>
            <option>Livestock Trailer</option>
            <option>Custom Build</option>
          </select>
        </div>
        <div class="form-group">
          <label for="trailer-size">Size / Spec</label>
          <input id="trailer-size" placeholder="e.g. 10x6 twin axle">
        </div>
      </div>
      <div class="form-group">
        <label for="trailer-notes">Job Notes / Specification</label>
        <textarea id="trailer-notes" placeholder="Any special requirements, options, finish…"></textarea>
      </div>

      <div class="section-heading">Financials</div>
      <div class="form-row">
        <div class="form-group">
          <label for="job-price">Total Price (£)</label>
          <input id="job-price" type="number" min="0" step="1" placeholder="0">
        </div>
        <div class="form-group">
          <label for="job-deposit">Deposit Taken (£)</label>
          <input id="job-deposit" type="number" min="0" step="1" placeholder="0">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="job-due">Target Completion</label>
          <input id="job-due" type="date">
        </div>
        <div class="form-group">
          <label for="job-assign">Lead Assigned To</label>
          <select id="job-assign">
            <option value="">Unassigned</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNewJob()">Create Job</button>
    </div>
  </div>
</div>

<!-- Header -->
<div class="header">
  <div class="header-logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="3" width="22" height="13" rx="2"/><path d="M5 16v2m14-2v2M3 13h18"/><circle cx="7" cy="19" r="2"/><circle cx="17" cy="19" r="2"/>
    </svg>
    <div>
      <div>KPC Engineering</div>
      <div class="header-sub">Job Tracker</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" id="togglePeopleBtn" onclick="togglePeopleView()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
      Team
    </button>
    <button class="btn btn-primary btn-sm" onclick="openNewJob()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Job
    </button>
  </div>
</div>

<!-- Stats -->
<div class="stats-bar" id="statsBar"></div>

<!-- Main -->
<div class="main">
  <div class="kanban-wrap" id="kanban"></div>

  <!-- Job detail panel -->
  <div class="panel" id="detailPanel" hidden>
    <div class="panel-header">
      <div>
        <div class="panel-title" id="panelTitle">Job #001</div>
        <div style="font-size:11px;color:var(--fg3);margin-top:1px" id="panelSub"></div>
      </div>
      <button class="close-btn" onclick="closePanel()">&times;</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
    <div class="panel-footer" id="panelFooter"></div>
  </div>

  <!-- People view panel -->
  <div class="panel" id="peoplePanel" hidden>
    <div class="panel-header">
      <div class="panel-title">Team View</div>
      <button class="close-btn" onclick="closePeople()">&times;</button>
    </div>
    <div class="panel-body" id="peopleBody"></div>
  </div>
</div>

<script>
// ── Data ──────────────────────────────────────────────────────────────────
const STAGES = [
  { id: 'quote',   label: 'Quoted',       color: '#7f8c8d' },
  { id: 'fab',     label: 'Fabrication',  color: '#e67e22' },
  { id: 'galv',    label: 'Galvanising',  color: '#8e44ad' },
  { id: 'order',   label: 'Ordering',     color: '#2980b9' },
  { id: 'fit',     label: 'Fitting',      color: '#16a085' },
  { id: 'ready',   label: 'Ready',        color: '#27ae60' },
  { id: 'done',    label: 'Delivered',    color: '#95a5a6' },
];

const DEFAULT_TASKS = {
  fab:   ['Steel prep','Welding','Frame assembly','Quality check'],
  galv:  ['Send to galvanisers','Collect from galvanisers'],
  order: ['Axles','Wheels','Coupling','Aluboard / decking','Chassis plate & pack','Lights & wiring','Electrics'],
  fit:   ['Fit axles & wheels','Coupling fitted','Decking / floor','Lights wired','Final inspection','Brake test'],
  ready: ['Balance invoice sent','Invoice paid','Delivery booked'],
};

const PEOPLE = [
  { id: 'p1', name: 'Mark',   role: 'Fabricator',  color: '#1d6fa4', initials: 'MK' },
  { id: 'p2', name: 'Steve',  role: 'Welder',       color: '#8e44ad', initials: 'SW' },
  { id: 'p3', name: 'Dave',   role: 'Fitter',       color: '#16a085', initials: 'DV' },
];

let jobs = [];
let nextId = 1;
let activeJobId = null;
let showPeople = false;

// Storage
function save() {
  try { localStorage.setItem('kpc_jobs', JSON.stringify({ jobs, nextId })); } catch(e){}
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('kpc_jobs') || 'null');
    if (d) { jobs = d.jobs; nextId = d.nextId; }
  } catch(e){}
  if (!jobs.length) seedDemo();
}

function seedDemo() {
  const today = new Date();
  const fmt = d => d.toISOString().slice(0,10);
  const addDays = n => { const d = new Date(today); d.setDate(d.getDate()+n); return fmt(d); };

  const demo = [
    { customer:'James Hartley', phone:'07700 900123', email:'jh@example.com', trailerType:'Flatbed Trailer', spec:'12x6 twin axle', notes:'Ramp required at rear', price:3200, deposit:800, deposited:true, stage:'fab', due:addDays(14), assigned:'p1',
      tasks:buildTasks(), activity:[{text:'Job created',time:addDays(-3)},{text:'Deposit £800 received',time:addDays(-3)},{text:'Steel prepped and tacked',time:addDays(-1)}] },
    { customer:'S&P Groundworks', phone:'01234 567890', email:'office@spg.co.uk', trailerType:'Plant Trailer', spec:'16x8 tri-axle heavy duty', notes:'Heavy duty ramps, mesh floor', price:6500, deposit:2000, deposited:true, stage:'galv', due:addDays(21), assigned:'p2',
      tasks:buildTasks(), activity:[{text:'Job created',time:addDays(-10)},{text:'Frame welding complete',time:addDays(-5)},{text:'Sent to galvanisers (Midland Galv)',time:addDays(-2)}] },
    { customer:'Tom Reeves', phone:'07900 112233', email:'tom@farms.net', trailerType:'Livestock Trailer', spec:'14x6 single deck', notes:'Aluminium sides, divider gate', price:4800, deposit:1200, deposited:true, stage:'order', due:addDays(28), assigned:'p3',
      tasks:buildTasks(), activity:[{text:'Job created',time:addDays(-6)},{text:'Galvanising collected',time:addDays(-1)},{text:'Parts order placed – axles on 3 wks lead'}] },
    { customer:'Dan Walters', phone:'07500 999888', email:'dan.w@hotmail.com', trailerType:'Box Trailer', spec:'10x5 single axle', notes:'Full aluminium sides', price:2200, deposit:550, deposited:true, stage:'fit', due:addDays(7), assigned:'p1',
      tasks:buildTasks(), activity:[{text:'Job created',time:addDays(-18)},{text:'Parts all received',time:addDays(-4)},{text:'Axles and coupling fitted',time:addDays(-2)}] },
    { customer:'Lynne Harrison', phone:'07800 010203', email:'lynne@example.com', trailerType:'Horse Box', spec:'Custom 2 stall', notes:'Rubber matting, tack room, roof vent', price:8900, deposit:0, deposited:false, stage:'quote', due:addDays(42), assigned:'',
      tasks:buildTasks(), activity:[{text:'Enquiry received, quote sent',time:addDays(-1)}] },
    { customer:'ABC Plant Hire', phone:'01600 445566', email:'ops@abc.co.uk', trailerType:'Car Transporter', spec:'20ft flat, winch', notes:'Electric winch, wheel straps', price:5400, deposit:1350, deposited:true, stage:'ready', due:addDays(2), assigned:'p3',
      tasks:buildTasks(), activity:[{text:'Job completed',time:addDays(-1)},{text:'Balance invoice sent',time:addDays(-1)}] },
  ];
  demo.forEach(d => {
    jobs.push({ id: nextId++, ...d, tasks: buildTasks(d.stage) });
  });
  // mark some tasks done on the demo jobs
  jobs[0].tasks.fab.forEach((t,i) => { if(i<2) t.done=true; });
  jobs[1].tasks.fab.forEach(t => t.done=true);
  jobs[1].tasks.galv.forEach((t,i) => { if(i===0) t.done=true; });
  jobs[2].tasks.fab.forEach(t => t.done=true);
  jobs[2].tasks.galv.forEach(t => t.done=true);
  jobs[2].tasks.order.forEach((t,i) => { if(i<4) t.done=true; });
  jobs[3].tasks.fab.forEach(t => t.done=true);
  jobs[3].tasks.galv.forEach(t => t.done=true);
  jobs[3].tasks.order.forEach(t => t.done=true);
  jobs[3].tasks.fit.forEach((t,i) => { if(i<2) t.done=true; });
  jobs[5].tasks.fab.forEach(t => t.done=true);
  jobs[5].tasks.galv.forEach(t => t.done=true);
  jobs[5].tasks.order.forEach(t => t.done=true);
  jobs[5].tasks.fit.forEach(t => t.done=true);
  jobs[5].tasks.ready.forEach((t,i) => { if(i<1) t.done=true; });
  save();
}

function buildTasks(stage) {
  const tasks = {};
  Object.keys(DEFAULT_TASKS).forEach(s => {
    tasks[s] = DEFAULT_TASKS[s].map(t => ({ label:t, done:false, assignedTo:'' }));
  });
  return tasks;
}

// ── Rendering ─────────────────────────────────────────────────────────────
function render() {
  renderStats();
  renderKanban();
  if (activeJobId) renderPanel(activeJobId);
  if (showPeople) renderPeople();
}

function renderStats() {
  const active = jobs.filter(j => j.stage !== 'done');
  const totalValue = active.reduce((s,j) => s + (j.price||0), 0);
  const deposits = active.reduce((s,j) => s + (j.deposited ? (j.deposit||0) : 0), 0);
  const outstanding = active.reduce((s,j) => s + (j.deposited ? (j.price||0)-(j.deposit||0) : 0), 0);
  const overdue = active.filter(j => j.due && new Date(j.due) < new Date()).length;

  const statsBar = document.getElementById('statsBar');
  statsBar.innerHTML = `
    <div class="stat-cell"><span class="num">${active.length}</span>Active Jobs</div>
    <div class="stat-cell"><span class="num money">£${totalValue.toLocaleString()}</span>Total Value</div>
    <div class="stat-cell"><span class="num money" style="color:var(--success)">£${deposits.toLocaleString()}</span>Deposits In</div>
    <div class="stat-cell"><span class="num money" style="color:var(--warn)">£${outstanding.toLocaleString()}</span>Outstanding</div>
    <div class="stat-cell"><span class="num" style="color:${overdue>0?'var(--danger)':'var(--fg)'}">${overdue}</span>Overdue</div>
  `;
}

function renderKanban() {
  const kanban = document.getElementById('kanban');
  kanban.innerHTML = '';
  STAGES.forEach(stage => {
    const stageJobs = jobs.filter(j => j.stage === stage.id);
    const lane = document.createElement('div');
    lane.className = 'lane';
    lane.innerHTML = `
      <div class="lane-header">
        <span class="lane-dot" style="background:${stage.color}"></span>
        ${stage.label}
        <span class="lane-count">${stageJobs.length}</span>
      </div>
      <div class="lane-cards" id="lane-${stage.id}"></div>
    `;
    kanban.appendChild(lane);
    const container = lane.querySelector('.lane-cards');
    if (!stageJobs.length) {
      container.innerHTML = '<div class="empty"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/></svg><div>No jobs</div></div>';
    }
    stageJobs.forEach(j => {
      container.appendChild(makeCard(j, stage));
    });
  });
}

function makeCard(job, stage) {
  const card = document.createElement('div');
  card.className = 'card';
  card.style.setProperty('--accent', stage.color);
  card.querySelector ? null : null;
  card.innerHTML = `<style scoped>.card::before{background:${stage.color}}</style>`;

  const isOverdue = job.due && new Date(job.due) < new Date() && job.stage !== 'done';
  const totalTasks = Object.values(job.tasks||{}).flat().length;
  const doneTasks = Object.values(job.tasks||{}).flat().filter(t=>t.done).length;
  const person = PEOPLE.find(p => p.id === job.assigned);
  const balance = (job.price||0) - (job.deposit||0);

  card.style.borderLeftColor = 'transparent';
  const inner = document.createElement('div');
  inner.style.cssText = `position:absolute;left:0;top:0;bottom:0;width:3px;background:${stage.color};border-radius:3px 0 0 3px`;

  card.innerHTML = '';
  card.appendChild(inner);

  const content = document.createElement('div');
  content.innerHTML = `
    <div class="card-ref">JOB #${String(job.id).padStart(3,'0')}</div>
    <div class="card-name">${esc(job.customer)}</div>
    <div class="card-trailer">${esc(job.trailerType)}${job.spec ? ' · '+esc(job.spec) : ''}</div>
    <div class="card-meta">
      ${person ? `<span class="chip chip-person" style="background:${person.color}22;color:${person.color}">${person.initials}</span>` : ''}
      ${totalTasks > 0 ? `<span class="chip chip-task">${doneTasks}/${totalTasks} tasks</span>` : ''}
      ${job.deposited ? `<span class="chip chip-deposit">£${(job.deposit||0).toLocaleString()} dep</span>` : ''}
      ${!job.deposited && job.price ? `<span class="chip chip-balance">No deposit</span>` : ''}
    </div>
    ${job.due ? `<div class="card-date" style="color:${isOverdue?'var(--danger)':'var(--fg3)'}">
      ${isOverdue ? '⚠ ' : ''}Due ${fmtDate(job.due)}
    </div>` : ''}
  `;
  card.appendChild(content);
  card.onclick = () => openPanel(job.id);
  return card;
}

// ── Panel ─────────────────────────────────────────────────────────────────
function openPanel(id) {
  activeJobId = id;
  document.getElementById('detailPanel').hidden = false;
  if (showPeople) closePeople();
  renderPanel(id);
}
function closePanel() {
  document.getElementById('detailPanel').hidden = true;
  activeJobId = null;
}

function renderPanel(id) {
  const job = jobs.find(j => j.id === id);
  if (!job) return;
  const stage = STAGES.find(s => s.id === job.stage);
  const person = PEOPLE.find(p => p.id === job.assigned);
  const balance = (job.price||0) - (job.deposit||0);

  document.getElementById('panelTitle').textContent = `JOB #${String(job.id).padStart(3,'0')} · ${job.customer}`;
  document.getElementById('panelSub').textContent = `${job.trailerType}${job.spec?' · '+job.spec:''}`;

  const body = document.getElementById('panelBody');
  body.innerHTML = `
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab(this,'tab-overview')">Overview</button>
      <button class="tab-btn" onclick="switchTab(this,'tab-tasks')">Tasks</button>
      <button class="tab-btn" onclick="switchTab(this,'tab-finance')">Finance</button>
      <button class="tab-btn" onclick="switchTab(this,'tab-activity')">Activity</button>
    </div>

    <!-- OVERVIEW -->
    <div id="tab-overview" class="tab-pane">
      <div class="section-heading">Stage</div>
      <div class="stage-row" id="stageRow"></div>

      <div class="section-heading" style="margin-top:16px">Assigned To</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap" id="assignRow"></div>

      <div class="section-heading">Customer</div>
      <div style="font-size:13px;line-height:1.9">
        <div><strong>${esc(job.customer)}</strong></div>
        ${job.phone?`<div style="color:var(--fg2)">${esc(job.phone)}</div>`:''}
        ${job.email?`<div style="color:var(--fg2)">${esc(job.email)}</div>`:''}
      </div>

      ${job.notes ? `<div class="section-heading">Job Notes</div>
      <div style="font-size:13px;color:var(--fg2);line-height:1.6">${esc(job.notes)}</div>` : ''}

      ${job.due ? `<div class="section-heading">Target Date</div>
      <div style="font-size:13px">${fmtDate(job.due)}</div>` : ''}
    </div>

    <!-- TASKS -->
    <div id="tab-tasks" class="tab-pane" hidden>
      ${renderTasksHTML(job)}
    </div>

    <!-- FINANCE -->
    <div id="tab-finance" class="tab-pane" hidden>
      <div class="money-box">
        <div class="money-row"><span class="label">Total Price</span><span class="val">£${(job.price||0).toLocaleString()}</span></div>
        <div class="money-row"><span class="label">Deposit Received</span><span class="val text-success">${job.deposited?'£'+(job.deposit||0).toLocaleString():'Not yet taken'}</span></div>
        <div class="money-row total"><span class="label">Balance Due</span><span class="val ${balance>0?'text-warn':'text-success'}">£${balance.toLocaleString()}</span></div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Total Price (£)</label>
          <input type="number" value="${job.price||''}" id="fp-price" onchange="updateJobField(${id},'price',parseFloat(this.value)||0)">
        </div>
        <div class="form-group">
          <label>Deposit (£)</label>
          <input type="number" value="${job.deposit||''}" id="fp-deposit" onchange="updateJobField(${id},'deposit',parseFloat(this.value)||0)">
        </div>
      </div>
      <div class="form-group">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:13px;font-weight:500">
          <input type="checkbox" style="width:15px;height:15px;accent-color:var(--accent)" ${job.deposited?'checked':''} onchange="updateJobField(${id},'deposited',this.checked)">
          Deposit received
        </label>
      </div>
    </div>

    <!-- ACTIVITY -->
    <div id="tab-activity" class="tab-pane" hidden>
      <div class="activity" id="actLog">
        ${(job.activity||[]).slice().reverse().map(a=>`
          <div class="activity-entry">${esc(a.text)}
            ${a.time?`<span class="activity-time">${fmtDate(a.time)}</span>`:''}
          </div>
        `).join('')}
      </div>
      <div class="note-add" style="margin-top:12px">
        <input id="noteInput" placeholder="Add a note…" onkeydown="if(event.key==='Enter')addNote(${id})">
        <button class="btn btn-primary btn-sm" onclick="addNote(${id})">Add</button>
      </div>
    </div>
  `;

  // Stage buttons
  const stageRow = body.querySelector('#stageRow');
  STAGES.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'stage-btn' + (s.id === job.stage ? ' active' : '');
    btn.textContent = s.label;
    btn.style.cssText = `background:${s.color}22;color:${s.color}`;
    btn.onclick = () => { moveJobStage(id, s.id); };
    stageRow.appendChild(btn);
  });

  // Assign row
  const assignRow = body.querySelector('#assignRow');
  const unBtn = document.createElement('button');
  unBtn.className = 'stage-btn' + (!job.assigned ? ' active' : '');
  unBtn.textContent = 'Unassigned';
  unBtn.style.cssText = `background:var(--border);color:var(--fg3)`;
  unBtn.onclick = () => updateJobField(id, 'assigned', '');
  assignRow.appendChild(unBtn);
  PEOPLE.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'stage-btn' + (job.assigned === p.id ? ' active' : '');
    btn.textContent = p.name;
    btn.style.cssText = `background:${p.color}22;color:${p.color}`;
    btn.onclick = () => updateJobField(id, 'assigned', p.id);
    assignRow.appendChild(btn);
  });

  // Footer
  const footer = document.getElementById('panelFooter');
  footer.innerHTML = `<button class="btn btn-danger btn-sm" onclick="deleteJob(${id})">Delete Job</button>`;

  // Wire up task checkboxes
  body.querySelectorAll('.task-item input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => {
      const s = cb.dataset.stage, i = parseInt(cb.dataset.idx);
      job.tasks[s][i].done = cb.checked;
      const lbl = cb.nextElementSibling;
      if (lbl) lbl.className = 'done' ? (cb.checked ? 'done' : '') : (cb.checked ? 'done' : '');
      lbl && (lbl.className = cb.checked ? 'done' : '');
      save();
      renderKanban();
    });
  });
  // task assign dropdowns
  body.querySelectorAll('.task-assign-sel').forEach(sel => {
    sel.addEventListener('change', () => {
      const s = sel.dataset.stage, i = parseInt(sel.dataset.idx);
      job.tasks[s][i].assignedTo = sel.value;
      save();
      if(showPeople) renderPeople();
    });
  });
}

function renderTasksHTML(job) {
  let html = '';
  STAGES.filter(s => DEFAULT_TASKS[s.id]).forEach(s => {
    const tasks = job.tasks?.[s.id] || [];
    if (!tasks.length) return;
    const done = tasks.filter(t=>t.done).length;
    html += `<div class="section-heading" style="color:${s.color}">${s.label} (${done}/${tasks.length})</div>
    <div class="task-list">`;
    tasks.forEach((t, i) => {
      const pid = `tc-${s.id}-${i}`;
      const person = PEOPLE.find(p => p.id === t.assignedTo);
      html += `<div class="task-item">
        <input type="checkbox" id="${pid}" data-stage="${s.id}" data-idx="${i}" ${t.done?'checked':''}>
        <label for="${pid}" class="${t.done?'done':''}">${esc(t.label)}</label>
        <select class="task-assign-sel" data-stage="${s.id}" data-idx="${i}" style="width:auto;padding:2px 4px;font-size:11px;border-radius:4px">
          <option value="">—</option>
          ${PEOPLE.map(p=>`<option value="${p.id}" ${t.assignedTo===p.id?'selected':''}>${p.name}</option>`).join('')}
        </select>
      </div>`;
    });
    html += '</div>';
  });
  return html || '<div class="empty">No tasks defined</div>';
}

function switchTab(btn, tabId) {
  btn.closest('.panel-body, .modal-body').querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  btn.closest('.panel-body, .modal-body').querySelectorAll('.tab-pane').forEach(p => p.hidden = true);
  const pane = document.getElementById(tabId);
  if(pane) pane.hidden = false;
}

// ── People view ───────────────────────────────────────────────────────────
function togglePeopleView() {
  showPeople = !showPeople;
  document.getElementById('peoplePanel').hidden = !showPeople;
  if (showPeople) { closePanel(); renderPeople(); }
}
function closePeople() {
  showPeople = false;
  document.getElementById('peoplePanel').hidden = true;
}
function renderPeople() {
  const body = document.getElementById('peopleBody');
  let html = '<div class="people-grid">';
  PEOPLE.forEach(person => {
    const myJobs = jobs.filter(j => j.stage !== 'done' && j.assigned === person.id);
    // also find tasks assigned to them
    const myTasks = [];
    jobs.forEach(j => {
      if (j.stage === 'done') return;
      Object.entries(j.tasks||{}).forEach(([stage, tasks]) => {
        tasks.forEach(t => {
          if (t.assignedTo === person.id && !t.done) {
            myTasks.push({ jobId:j.id, jobName:j.customer, task:t.label, stage });
          }
        });
      });
    });

    html += `<div class="person-card">
      <div class="person-header">
        <div class="person-avatar" style="background:${person.color}">${person.initials}</div>
        <div>
          <div class="person-name">${person.name}</div>
          <div class="person-role">${person.role} · ${myJobs.length} jobs</div>
        </div>
      </div>`;

    if (myTasks.length) {
      html += '<div class="person-jobs">';
      myTasks.slice(0,8).forEach(t => {
        const job = jobs.find(j=>j.id===t.jobId);
        const stg = STAGES.find(s=>s.id===t.stage);
        html += `<div class="person-job-row" onclick="openPanel(${t.jobId})" style="cursor:pointer">
          <span class="person-job-ref">#${String(t.jobId).padStart(3,'0')}</span>
          <span class="person-job-name">${esc(t.task)}</span>
          <span class="person-task" style="color:${stg?.color||'var(--fg3)'}">${stg?.label||''}</span>
        </div>`;
      });
      html += '</div>';
    } else {
      html += '<div class="empty" style="padding:12px">No tasks assigned</div>';
    }
    html += '</div>';
  });
  html += '</div>';
  body.innerHTML = html;
}

// ── Actions ───────────────────────────────────────────────────────────────
function openNewJob() {
  // populate assign dropdown
  const sel = document.getElementById('job-assign');
  sel.innerHTML = '<option value="">Unassigned</option>' + PEOPLE.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  document.getElementById('newJobModal').hidden = false;
}
function closeModal() { document.getElementById('newJobModal').hidden = true; }

function saveNewJob() {
  const get = id => document.getElementById(id).value.trim();
  const customer = get('cust-name');
  if (!customer) { alert('Please enter a customer name'); return; }
  const job = {
    id: nextId++,
    customer,
    phone: get('cust-phone'),
    email: get('cust-email'),
    trailerType: get('trailer-type') || 'Trailer',
    spec: get('trailer-size'),
    notes: get('trailer-notes'),
    price: parseFloat(document.getElementById('job-price').value)||0,
    deposit: parseFloat(document.getElementById('job-deposit').value)||0,
    deposited: (parseFloat(document.getElementById('job-deposit').value)||0) > 0,
    stage: 'quote',
    due: get('job-due'),
    assigned: get('job-assign'),
    tasks: buildTasks(),
    activity: [{ text: 'Job created', time: new Date().toISOString().slice(0,10) }]
  };
  if (job.deposited && job.deposit > 0) job.activity.push({ text: `Deposit £${job.deposit.toLocaleString()} received`, time: new Date().toISOString().slice(0,10) });
  jobs.push(job);
  save();
  closeModal();
  // reset form
  ['cust-name','cust-phone','cust-email','trailer-type','trailer-size','trailer-notes','job-price','job-deposit','job-due'].forEach(id => { document.getElementById(id).value=''; });
  render();
  openPanel(job.id);
}

function moveJobStage(id, stage) {
  const job = jobs.find(j=>j.id===id);
  if (!job || job.stage===stage) return;
  const oldStage = STAGES.find(s=>s.id===job.stage);
  const newStage = STAGES.find(s=>s.id===stage);
  job.stage = stage;
  job.activity = job.activity||[];
  job.activity.push({ text: `Moved from ${oldStage?.label} → ${newStage?.label}`, time: new Date().toISOString().slice(0,10) });
  save();
  render();
}

function updateJobField(id, field, val) {
  const job = jobs.find(j=>j.id===id);
  if (!job) return;
  job[field] = val;
  save();
  if (field === 'assigned' || field === 'stage') render();
  else { renderStats(); if(activeJobId===id) renderPanel(id); }
}

function addNote(id) {
  const inp = document.getElementById('noteInput');
  const text = inp.value.trim();
  if (!text) return;
  const job = jobs.find(j=>j.id===id);
  if (!job) return;
  job.activity = job.activity||[];
  job.activity.push({ text, time: new Date().toISOString().slice(0,10) });
  inp.value = '';
  save();
  renderPanel(id);
  // scroll activity into view
  const log = document.getElementById('actLog');
  if(log) { log.scrollTop = 0; }
}

function deleteJob(id) {
  if (!confirm(`Delete job #${String(id).padStart(3,'0')}? This cannot be undone.`)) return;
  jobs = jobs.filter(j=>j.id!==id);
  save();
  closePanel();
  render();
}

// ── Helpers ───────────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}

// ── Init ──────────────────────────────────────────────────────────────────
load();
render();
</script>
