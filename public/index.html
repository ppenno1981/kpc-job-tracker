<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPC Job Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root {
  --bg: #f0f2f5;
  --surface: #ffffff;
  --surface2: #f8f9fb;
  --border: #e2e6ea;
  --fg: #1a2332;
  --fg2: #5a6778;
  --fg3: #8c99a8;
  --accent: #1d6fa4;
  --accent-light: #e8f3fb;
  --accent-dark: #155682;
  --danger: #c0392b;
  --warn: #e67e22;
  --success: #27ae60;
  --steel: #2c3e50;
  --radius: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
  --shadow-md: 0 4px 12px rgba(0,0,0,.12);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1621; --surface: #1a2332; --surface2: #1e2a3a;
    --border: #2a3a4e; --fg: #e8edf2; --fg2: #9aaabb; --fg3: #5a6e82;
    --accent: #3a9fd6; --accent-light: #1a3550; --accent-dark: #5ab8e8; --steel: #c5d0da;
    color-scheme: dark;
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:14px;line-height:1.5;min-height:100vh}

/* Header */
.header{position:sticky;top:0;z-index:100;background:var(--steel);display:flex;align-items:center;gap:12px;padding:0 20px;height:56px;color:#fff}
.header-logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;color:#fff;display:flex;align-items:center;gap:8px}
.header-sub{font-size:11px;opacity:.6;margin-top:1px}
.header-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:.15s;font-family:inherit;text-decoration:none}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-dark)}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff}.btn-ghost:hover{background:rgba(255,255,255,.2)}
.btn-secondary{background:var(--surface2);color:var(--fg);border:1px solid var(--border)}.btn-secondary:hover{background:var(--border)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-success{background:var(--success);color:#fff}

/* Stats */
.stats-bar{display:flex;gap:1px;background:var(--border);border-bottom:1px solid var(--border)}
.stat-cell{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 8px;background:var(--surface);font-size:11px;color:var(--fg2);font-weight:500;letter-spacing:.3px;text-transform:uppercase;min-width:90px}
.stat-cell .num{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg);line-height:1.2}

/* Layout */
.main{display:flex;height:calc(100vh - 56px - 54px);overflow:hidden}

/* Kanban */
.kanban-wrap{flex:1;overflow-x:auto;overflow-y:hidden;padding:14px;display:flex;gap:10px}
.lane{flex:0 0 220px;display:flex;flex-direction:column;max-height:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.lane-header{padding:9px 12px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--border);font-weight:600;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--fg2);flex-shrink:0}
.lane-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.lane-count{margin-left:auto;background:var(--border);color:var(--fg3);font-size:11px;padding:1px 6px;border-radius:10px;font-weight:700}
.lane-cards{flex:1;overflow-y:auto;padding:9px;display:flex;flex-direction:column;gap:7px}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 12px;cursor:pointer;box-shadow:var(--shadow);transition:box-shadow .15s,transform .1s;position:relative;padding-left:15px}
.card-stripe{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.card-ref{font-size:10px;color:var(--fg3);font-weight:600;letter-spacing:.3px}
.card-name{font-weight:600;font-size:13px;margin:1px 0;color:var(--fg)}
.card-trailer{font-size:11px;color:var(--fg2);margin-bottom:5px}
.card-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px}
.chip-task{background:var(--border);color:var(--fg2)}
.card-date{font-size:10px;color:var(--fg3);margin-top:4px}

/* Panel */
.panel{width:380px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.panel[hidden]{display:none}
.panel-header{padding:14px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.panel-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;line-height:1.3}
.panel-body{flex:1;overflow-y:auto;padding:18px}
.panel-footer{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.close-btn{background:none;border:none;cursor:pointer;color:var(--fg3);font-size:20px;padding:2px 6px;border-radius:4px;line-height:1;flex-shrink:0}
.close-btn:hover{background:var(--border);color:var(--fg)}

/* Tabs */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab-btn{padding:7px 13px;font-size:12px;font-weight:600;color:var(--fg3);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:inherit;transition:.15s;margin-bottom:-1px}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-pane[hidden]{display:none}

/* Forms */
.form-group{margin-bottom:12px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:11px;font-weight:600;color:var(--fg2);margin-bottom:4px;letter-spacing:.3px;text-transform:uppercase}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;color:var(--fg);background:var(--bg);transition:border-color .15s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
.section-h{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--fg3);margin:18px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.section-h:first-child{margin-top:0}

/* Stage buttons */
.stage-row{display:flex;gap:5px;flex-wrap:wrap}
.stage-btn{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px;border:2px solid transparent;cursor:pointer;transition:.15s;font-family:inherit}
.stage-btn.active{border-color:currentColor}

/* Task list */
.task-list{display:flex;flex-direction:column;gap:4px}
.task-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);font-size:12px}
.task-item input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.task-label{flex:1;font-weight:500;cursor:pointer}
.task-label.done{text-decoration:line-through;color:var(--fg3)}
.task-assign-sel{width:auto!important;padding:2px 4px!important;font-size:11px!important;border-radius:4px!important}

/* Money box */
.money-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.money-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:13px}
.money-row .lbl{color:var(--fg2)}
.money-row .val{font-weight:700;font-variant-numeric:tabular-nums}
.money-row.total{border-top:1px solid var(--border);margin-top:6px;padding-top:8px;font-size:14px}
.text-success{color:var(--success)}.text-warn{color:var(--warn)}.text-danger{color:var(--danger)}

/* Activity */
.activity{display:flex;flex-direction:column;gap:6px}
.activity-entry{font-size:12px;color:var(--fg2);padding:7px 10px;background:var(--surface2);border-radius:6px;border-left:2px solid var(--border)}
.activity-time{font-size:10px;color:var(--fg3);display:block;margin-top:2px}
.note-add{display:flex;gap:8px;margin-top:10px}
.note-add input{flex:1}

/* Invoice buttons */
.invoice-row{display:flex;gap:8px;margin-top:4px}

/* People */
.person-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:10px}
.person-header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface2);border-bottom:1px solid var(--border)}
.person-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
.person-name{font-weight:700;font-size:14px}
.person-role{font-size:11px;color:var(--fg3)}
.person-jobs{padding:10px 14px;display:flex;flex-direction:column;gap:5px}
.person-job-row{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 8px;border-radius:6px;background:var(--surface2);cursor:pointer}
.pjr-ref{color:var(--fg3);font-weight:600;font-size:11px;min-width:50px}
.pjr-name{flex:1;font-weight:500}
.pjr-stage{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--border);color:var(--fg2)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-overlay[hidden]{display:none}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-header{padding:20px 24px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px}
.modal-body{flex:1;overflow-y:auto;padding:24px}
.modal-footer{padding:14px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--steel);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* Loader */
.loader{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--fg3);font-size:13px}

/* Empty */
.empty{text-align:center;padding:20px 12px;color:var(--fg3);font-size:12px}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Schedule calendar modal */
.sched-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
.sched-modal{background:var(--surface);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(900px,100%);height:calc(100vh - 40px);max-height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden}
.sched-modal-header{padding:16px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.sched-modal-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px}
.sched-modal-nav{display:flex;align-items:center;gap:8px}
.sched-month-label{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;min-width:160px;text-align:center}
.sched-nav-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;cursor:pointer;padding:5px 10px;font-size:13px;color:var(--fg);transition:background .15s}
.sched-nav-btn:hover{background:var(--border)}
.sched-modal-legend{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--fg2)}
.sched-legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sched-modal-body{flex:1;overflow-y:auto;padding:16px 20px 20px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;text-align:center;padding:4px 0 8px;color:var(--fg3);letter-spacing:.4px;text-transform:uppercase}
.cal-day{min-height:80px;border:1px solid var(--border);border-radius:6px;padding:5px 6px;background:var(--surface);position:relative}
.cal-day.other-month{background:var(--surface2);opacity:.5}
.cal-day.today{border-color:#3b82f6;border-width:2px}
.cal-day-num{font-size:11px;font-weight:700;color:var(--fg3);margin-bottom:3px;line-height:1}
.cal-day.today .cal-day-num{color:#3b82f6}
.cal-chip{font-size:10px;font-weight:600;padding:2px 5px;border-radius:4px;margin-bottom:2px;cursor:pointer;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:100%;transition:opacity .15s}
.cal-chip:hover{opacity:.75}
.cal-chip.fab{background:#dbeafe;color:#1d4ed8}
.cal-chip.fit{background:#dcfce7;color:#15803d}
@media(prefers-color-scheme:dark){
  .cal-chip.fab{background:#1e3a5f;color:#60a5fa}
  .cal-chip.fit{background:#14401f;color:#4ade80}
}
@media(max-width:600px){
  .sched-modal-overlay{padding:0}
  .sched-modal{border-radius:0;width:100%;max-height:100vh}
  .cal-day{min-height:60px}
  .cal-chip{font-size:9px}
}

/* Warning banner */
.warn-banner{background:#fef3cd;border:1px solid #ffc107;border-radius:var(--radius);padding:8px 12px;font-size:12px;color:#856404;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}
@media(prefers-color-scheme:dark){.warn-banner{background:#3a2a00;border-color:#7a5c00;color:#ffd060}}

/* Admin badge */
.admin-badge{background:rgba(255,255,255,.18);color:#fff;border-radius:4px;padding:2px 7px;font-size:10px;font-weight:700;letter-spacing:.5px}

/* Archive view toggle */
.view-toggle{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--surface)}
.view-btn{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--fg2);font-family:inherit;transition:.15s}
.view-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Galv list modal */
.galv-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);font-size:12px;margin-bottom:4px}
.galv-item input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}

/* Task done-at */
.task-done-at{font-size:10px;color:var(--fg3);white-space:nowrap}

@media(max-width:700px){
  .panel{width:100%;position:fixed;inset:0;z-index:150;border-left:none}
  .stats-bar{overflow-x:auto}
}
</style>
</head>
<body>

<!-- New Job Modal -->
<div class="modal-overlay" id="newJobModal" hidden>
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">New Job</span>
      <button class="close-btn" onclick="closeNewJob()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="section-h">Customer</div>
      <div class="form-row">
        <div class="form-group"><label>Customer Name *</label><input id="n-cust" placeholder="e.g. John Smith" required></div>
        <div class="form-group"><label>Phone</label><input id="n-phone" type="tel" placeholder="07700 000000"></div>
      </div>
      <div class="form-group"><label>Email</label><input id="n-email" type="email" placeholder="customer@email.com"></div>

      <div class="section-h">Trailer</div>
      <div class="form-row">
        <div class="form-group">
          <label>Trailer Type</label>
          <select id="n-type">
            <option value="">Select…</option>
            <optgroup label="── KPC Build Sheets ──">
              <option>Whiterock Road Trailer</option>
              <option>WhiteWater Boat Trailer</option>
              <option>Boxxa Box Trailer</option>
              <option>ATV Trailer</option>
              <option>IBC Trailer</option>
            </optgroup>
            <optgroup label="── Other ──">
              <option>Flatbed Trailer</option>
              <option>Plant Trailer</option>
              <option>Car Transporter</option>
              <option>Horse Box</option>
              <option>Tipper Trailer</option>
              <option>Livestock Trailer</option>
              <option>Custom Build</option>
            </optgroup>
          </select>
        </div>
        <div class="form-group"><label>Size / Spec</label><input id="n-spec" placeholder="e.g. 10x6 twin axle"></div>
      </div>
      <div class="form-group"><label>Job Notes / Specification</label><textarea id="n-notes" placeholder="Special requirements, finish, options…"></textarea></div>

      <div class="section-h">Financials</div>
      <div class="form-row">
        <div class="form-group"><label>Total Price (£)</label><input id="n-price" type="number" min="0" step="1" placeholder="0"></div>
        <div class="form-group"><label>Deposit Taken (£)</label><input id="n-deposit" type="number" min="0" step="1" placeholder="0"></div>
      </div>
      <div class="form-group">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:13px;font-weight:500">
          <input type="checkbox" id="n-deposited" style="width:15px;height:15px;accent-color:var(--accent)"> Deposit has been received
        </label>
      </div>

      <div class="section-h">Scheduling</div>
      <div class="form-row">
        <div class="form-group"><label>Target Completion</label><input id="n-due" type="date"></div>
        <div class="form-group"><label>Assigned To</label><select id="n-assign"><option value="">Unassigned</option></select></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeNewJob()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNewJob()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Create Job
      </button>
    </div>
  </div>
</div>

<!-- Admin PIN Modal -->
<div class="modal-overlay" id="adminModal" hidden>
  <div class="modal" style="max-width:320px">
    <div class="modal-header">
      <span class="modal-title">Admin Login</span>
      <button class="close-btn" onclick="document.getElementById('adminModal').hidden=true">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>PIN</label>
        <input id="adminPin" type="password" placeholder="Enter admin PIN" onkeydown="if(event.key==='Enter')verifyAdmin()">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="document.getElementById('adminModal').hidden=true">Cancel</button>
      <button class="btn btn-primary" onclick="verifyAdmin()">Unlock</button>
    </div>
  </div>
</div>

<!-- Galv List Modal -->
<div class="modal-overlay" id="galvModal" hidden>
  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <span class="modal-title">Galvanising Send List</span>
      <button class="close-btn" onclick="document.getElementById('galvModal').hidden=true">&times;</button>
    </div>
    <div class="modal-body" id="galvBody"><div class="loader">Loading…</div></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="document.getElementById('galvModal').hidden=true">Close</button>
      <button class="btn btn-primary" onclick="printGalvList()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Print / Save PDF
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Header -->
<div class="header">
  <div class="header-logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="3" width="22" height="13" rx="2"/><path d="M5 16v2m14-2v2M3 13h18"/><circle cx="7" cy="19" r="2"/><circle cx="17" cy="19" r="2"/>
    </svg>
    <div><div>KPC Engineering</div><div class="header-sub">Job Tracker</div></div>
  </div>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" onclick="toggleSchedule()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Schedule
    </button>
    <button class="btn btn-ghost btn-sm" onclick="openGalvList()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
      Galv List
    </button>
    <button class="btn btn-ghost btn-sm" id="teamBtn" onclick="toggleTeam()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
      Operatives
    </button>
    <button class="btn btn-ghost btn-sm" id="adminBtn" onclick="toggleAdmin()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      <span id="adminLabel">Admin</span>
    </button>
    <button class="btn btn-primary btn-sm" onclick="openNewJob()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Job
    </button>
  </div>
</div>

<!-- Stats -->
<div class="stats-bar" id="statsBar">
  <div class="stat-cell"><span class="num">—</span>Active Jobs</div>
</div>

<!-- View toggle -->
<div class="view-toggle">
  <button class="view-btn active" id="vbActive" onclick="switchView(false)">Active Jobs</button>
  <button class="view-btn" id="vbArchived" onclick="switchView(true)">Archived</button>
</div>

<!-- Main -->
<div class="main">
  <div class="kanban-wrap" id="kanban"><div class="loader">Loading jobs…</div></div>

  <!-- Job detail panel -->
  <div class="panel" id="detailPanel" hidden>
    <div class="panel-header">
      <div>
        <div class="panel-title" id="panelTitle"></div>
        <div style="font-size:11px;color:var(--fg3);margin-top:1px" id="panelSub"></div>
      </div>
      <button class="close-btn" onclick="closePanel()">&times;</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
    <div class="panel-footer" id="panelFooter"></div>
  </div>

  <!-- Team panel -->
  <div class="panel" id="teamPanel" hidden>
    <div class="panel-header">
      <div class="panel-title">Operatives</div>
      <button class="close-btn" onclick="closeTeam()">&times;</button>
    </div>
    <div class="panel-body" id="teamBody"></div>
  </div>

  <!-- dummy panel placeholder removed; schedule is now a modal overlay -->
</div>

<!-- Schedule calendar modal -->
<div class="sched-modal-overlay" id="schedulePanel" style="display:none" onclick="if(event.target===this)closeSchedule()">
  <div class="sched-modal">
    <div class="sched-modal-header">
      <div class="sched-modal-title">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:6px"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Schedule
      </div>
      <div class="sched-modal-nav">
        <button class="sched-nav-btn" onclick="shiftCalMonth(-1)">&#8249;</button>
        <span class="sched-month-label" id="calMonthLabel"></span>
        <button class="sched-nav-btn" onclick="shiftCalMonth(1)">&#8250;</button>
        <button class="sched-nav-btn" onclick="goCalToday()" style="font-size:11px;padding:5px 8px">Today</button>
      </div>
      <div style="display:flex;align-items:center;gap:14px">
        <div class="sched-modal-legend">
          <span class="sched-legend-dot" style="background:#3b82f6"></span>Fabrication
          <span class="sched-legend-dot" style="background:#22c55e;margin-left:6px"></span>Fitting
        </div>
        <button class="close-btn" onclick="closeSchedule()">&times;</button>
      </div>
    </div>
    <div class="sched-modal-body" id="scheduleBody"></div>
  </div>
</div>

<script>
const STAGES = [
  {id:'quote', label:'Quoted',      color:'#7f8c8d'},
  {id:'fab',   label:'Fabrication', color:'#e67e22'},
  {id:'galv',  label:'Galvanising', color:'#8e44ad'},
  {id:'order', label:'Ordering',    color:'#2980b9'},
  {id:'fit',   label:'Fitting',     color:'#16a085'},
  {id:'ready', label:'Ready',       color:'#27ae60'},
  {id:'done',  label:'Delivered',   color:'#95a5a6'},
];

const TASK_STAGES = {
  fab:['Steel prep','Welding','Frame assembly','Quality check'],
  galv:['Send to galvanisers','Collect from galvanisers'],
  order:['Axles','Wheels','Coupling','Aluboard / decking','Chassis plate & pack','Lights & wiring','Electrics'],
  fit:['Fit axles & wheels','Coupling fitted','Decking / floor','Lights wired','Final inspection','Brake test'],
  ready:['Balance invoice sent','Invoice paid','Delivery booked'],
};

let jobs = [];
let people = [];
let activeJobId = null;
let showTeam = false;
let isAdmin = false;
let showArchived = false;

// ── API helpers ───────────────────────────────────────────────────────────
const api = {
  get: url => fetch(url).then(r => r.json()),
  post: (url, body) => fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json()),
  patch: (url, body) => fetch(url,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json()),
  delete: url => fetch(url,{method:'DELETE'}).then(r=>r.json()),
};

// ── Init ──────────────────────────────────────────────────────────────────
async function init() {
  [jobs, people] = await Promise.all([api.get('/api/jobs'), api.get('/api/people')]);
  populateAssignSelect(document.getElementById('n-assign'));
  render();
}

async function loadJobs() {
  jobs = await api.get(showArchived ? '/api/jobs?archived=1' : '/api/jobs');
  render();
  if(showTeam) renderTeam();
}

function populateAssignSelect(sel) {
  sel.innerHTML = '<option value="">Unassigned</option>' +
    people.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
}

// ── Render ────────────────────────────────────────────────────────────────
function render() {
  renderStats();
  renderKanban();
}

function renderStats() {
  const active = jobs.filter(j => j.stage !== 'done');
  const overdue = active.filter(j => j.due_date && new Date(String(j.due_date).slice(0,10)+'T00:00:00') < new Date()).length;
  let html = `<div class="stat-cell"><span class="num">${showArchived?jobs.length:active.length}</span>${showArchived?'Archived':'Active'} Jobs</div>`;
  if (isAdmin && !showArchived) {
    const totalVal = active.reduce((s,j) => s + parseFloat(j.price||0), 0);
    const deposits = active.reduce((s,j) => s + (j.deposit_paid ? parseFloat(j.deposit_amount||0) : 0), 0);
    const outstanding = active.reduce((s,j) => { if (!j.balance_paid) return s + (parseFloat(j.price||0) - parseFloat(j.deposit_amount||0)); return s; }, 0);
    html += `<div class="stat-cell"><span class="num" style="font-size:16px">£${totalVal.toLocaleString()}</span>Total Value</div>
    <div class="stat-cell"><span class="num" style="font-size:16px;color:var(--success)">£${deposits.toLocaleString()}</span>Deposits In</div>
    <div class="stat-cell"><span class="num" style="font-size:16px;color:var(--warn)">£${outstanding.toLocaleString()}</span>Outstanding</div>`;
  }
  if (!showArchived) html += `<div class="stat-cell"><span class="num" style="color:${overdue>0?'var(--danger)':'var(--fg)'}">${overdue}</span>Overdue</div>`;
  document.getElementById('statsBar').innerHTML = html;
}

function renderKanban() {
  const wrap = document.getElementById('kanban');
  wrap.innerHTML = '';

  if (showArchived) {
    // Simple list view for archived jobs
    const list = document.createElement('div');
    list.style.cssText = 'flex:1;overflow-y:auto;padding:14px;max-width:700px';
    if (!jobs.length) {
      list.innerHTML = '<div class="empty" style="padding:40px">No archived jobs</div>';
    } else {
      jobs.forEach(j => {
        const stage = STAGES.find(s => s.id === j.stage);
        const person = people.find(p => p.id == j.assigned_to);
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;cursor:pointer;transition:box-shadow .15s';
        row.onmouseenter = ()=>row.style.boxShadow='0 2px 8px rgba(0,0,0,.12)';
        row.onmouseleave = ()=>row.style.boxShadow='';
        row.innerHTML = `
          <span style="font-size:11px;color:var(--fg3);font-weight:600;min-width:52px">JOB #${String(j.id).padStart(3,'0')}</span>
          <span style="font-weight:600;flex:1">${esc(j.customer_name)}</span>
          <span style="font-size:12px;color:var(--fg2)">${esc(j.trailer_type||'')}${j.spec?' · '+esc(j.spec):''}</span>
          <span style="font-size:11px;padding:2px 8px;border-radius:10px;background:${stage?.color}22;color:${stage?.color}">${stage?.label||''}</span>
          ${person?`<span style="font-size:11px;font-weight:600;color:${person.color}">${person.initials}</span>`:''}
        `;
        row.onclick = () => openPanel(j.id);
        list.appendChild(row);
      });
    }
    wrap.appendChild(list);
    return;
  }

  STAGES.forEach(stage => {
    const stageJobs = jobs.filter(j => j.stage === stage.id);
    const lane = document.createElement('div');
    lane.className = 'lane';
    lane.innerHTML = `
      <div class="lane-header">
        <span class="lane-dot" style="background:${stage.color}"></span>
        ${stage.label}
        <span class="lane-count">${stageJobs.length}</span>
      </div>
      <div class="lane-cards" id="lane-${stage.id}"></div>`;
    wrap.appendChild(lane);
    const cards = lane.querySelector('.lane-cards');
    if (!stageJobs.length) {
      cards.innerHTML = '<div class="empty">No jobs</div>';
      return;
    }
    stageJobs.forEach(j => cards.appendChild(makeCard(j, stage)));
  });
}

function makeCard(job, stage) {
  const card = document.createElement('div');
  card.className = 'card';
  const isOverdue = job.due_date && new Date(job.due_date) < new Date() && job.stage !== 'done';
  const person = people.find(p => p.id == job.assigned_to);
  card.innerHTML = `
    <div class="card-stripe" style="background:${stage.color}"></div>
    <div class="card-ref">JOB #${String(job.id).padStart(3,'0')}</div>
    <div class="card-name">${esc(job.customer_name)}</div>
    <div class="card-trailer">${esc(job.trailer_type||'')}${job.spec?' · '+esc(job.spec):''}</div>
    <div class="card-meta">
      ${person ? `<span class="chip" style="background:${person.color}22;color:${person.color}">${person.initials}</span>` : ''}
      ${job.deposit_paid ? `<span class="chip" style="background:#e8f8ef;color:var(--success)">£${parseFloat(job.deposit_amount||0).toLocaleString()} dep</span>` : ''}
    </div>
    ${job.due_date ? `<div class="card-date" style="color:${isOverdue?'var(--danger)':'var(--fg3)'}">
      ${isOverdue?'⚠ ':''}Due ${fmtDate(job.due_date)}</div>` : ''}
    ${job.ordering_warn ? `<div class="card-date" style="color:var(--warn);margin-top:2px">📦 Parts not all ordered</div>` : ''}`;
  card.onclick = () => openPanel(job.id);
  return card;
}

// ── Panel ─────────────────────────────────────────────────────────────────
async function openPanel(id) {
  activeJobId = id;
  closeTeam();
  document.getElementById('detailPanel').hidden = false;
  document.getElementById('panelBody').innerHTML = '<div class="loader">Loading…</div>';
  const job = await api.get(`/api/jobs/${id}`);
  renderPanel(job);
}

function closePanel() {
  document.getElementById('detailPanel').hidden = true;
  activeJobId = null;
}

function renderPanel(job) {
  const stage = STAGES.find(s => s.id === job.stage);
  const person = people.find(p => p.id == job.assigned_to);
  const price = parseFloat(job.price||0);
  const dep = parseFloat(job.deposit_amount||0);
  const balance = price - dep;

  document.getElementById('panelTitle').textContent = `JOB #${String(job.id).padStart(3,'0')} · ${job.customer_name}`;
  document.getElementById('panelSub').textContent = `${job.trailer_type||''}${job.spec?' · '+job.spec:''}`;

  const body = document.getElementById('panelBody');
  body.innerHTML = `
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab(this,'t-overview')">Overview</button>
      <button class="tab-btn" onclick="switchTab(this,'t-tasks')">Tasks</button>
      ${isAdmin?`<button class="tab-btn" onclick="switchTab(this,'t-finance')">Finance</button>`:''}
      <button class="tab-btn" onclick="switchTab(this,'t-activity')">Activity</button>
    </div>

    <!-- OVERVIEW -->
    <div id="t-overview" class="tab-pane">
      ${orderingWarning(job)}
      <div class="section-h">Stage</div>
      <div class="stage-row" id="sr-stage"></div>
      <div class="section-h" style="margin-top:14px">Assigned To</div>
      <div class="stage-row" id="sr-assign"></div>
      <div class="section-h">Customer</div>
      <div style="font-size:13px;line-height:2">
        <div><strong>${esc(job.customer_name)}</strong></div>
        ${job.customer_phone?`<div style="color:var(--fg2)">${esc(job.customer_phone)}</div>`:''}
        ${job.customer_email?`<div style="color:var(--fg2)">${esc(job.customer_email)}</div>`:''}
      </div>
      ${job.notes?`<div class="section-h">Notes</div><div style="font-size:13px;color:var(--fg2);line-height:1.6">${esc(job.notes)}</div>`:''}
      <div class="section-h" style="margin-top:14px">Extras / Additional Items</div>
      <textarea id="ov-extras" placeholder="List any extras or additions…" style="min-height:70px"
        onblur="saveExtras(${job.id})">${esc(job.extras||'')}</textarea>
      <div class="section-h" style="margin-top:14px">Target Date</div>
      <input type="date" id="ov-due-date" value="${job.due_date?String(job.due_date).slice(0,10):''}"
        style="font-family:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface2);color:var(--fg);cursor:pointer"
        onchange="api.patch('/api/jobs/${job.id}',{due_date:this.value||null}).then(()=>{refreshPanel(${job.id});loadJobs();})">
      ${['quote','fab'].includes(job.stage)?`
      <div class="section-h" style="margin-top:14px">Fabrication Date</div>
      <input type="date" id="ov-fab-date" value="${job.fab_date?String(job.fab_date).slice(0,10):''}"
        style="font-family:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);background:#dbeafe;color:#1d4ed8;cursor:pointer"
        onchange="api.patch('/api/jobs/${job.id}',{fab_date:this.value||null}).then(()=>{refreshPanel(${job.id});if(showSchedule)renderSchedule();})">
      `:''}
      ${['galv','order','fit'].includes(job.stage)?`
      <div class="section-h" style="margin-top:14px">Fitting Date</div>
      <input type="date" id="ov-fitting-date" value="${job.fitting_date?String(job.fitting_date).slice(0,10):''}"
        style="font-family:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);background:#dcfce7;color:#15803d;cursor:pointer"
        onchange="api.patch('/api/jobs/${job.id}',{fitting_date:this.value||null}).then(()=>{refreshPanel(${job.id});if(showSchedule)renderSchedule();})">
      `:''}
      ${isAdmin?`<div style="margin-top:12px"><button class="btn btn-secondary btn-sm" onclick="archiveJob(${job.id})">Archive Job</button></div>`:''}
    </div>

    <!-- TASKS -->
    <div id="t-tasks" class="tab-pane" hidden>${renderTasksHTML(job)}</div>

    <!-- FINANCE (admin only) -->
    ${isAdmin?`<div id="t-finance" class="tab-pane" hidden>
      <div class="money-box">
        <div class="money-row"><span class="lbl">Total Price</span><span class="val">£${price.toFixed(2)}</span></div>
        <div class="money-row"><span class="lbl">Deposit</span><span class="val ${job.deposit_paid?'text-success':'text-warn'}">${job.deposit_paid?'£'+dep.toFixed(2):'Not received'}</span></div>
        <div class="money-row total"><span class="lbl">Balance Due</span><span class="val ${job.balance_paid?'text-success':'text-warn'}">£${balance.toFixed(2)}</span></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Price (£)</label>
          <input type="number" value="${price||''}" onchange="patchJob(${job.id},{price:parseFloat(this.value)||0})"></div>
        <div class="form-group"><label>Deposit (£)</label>
          <input type="number" value="${dep||''}" onchange="patchJob(${job.id},{deposit_amount:parseFloat(this.value)||0})"></div>
      </div>
      <div class="form-group">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:13px;font-weight:500">
          <input type="checkbox" style="width:15px;height:15px;accent-color:var(--accent)" ${job.deposit_paid?'checked':''} onchange="patchJob(${job.id},{deposit_paid:this.checked})">
          Deposit received
        </label>
      </div>
      <div class="form-group">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:13px;font-weight:500">
          <input type="checkbox" style="width:15px;height:15px;accent-color:var(--accent)" ${job.balance_paid?'checked':''} onchange="patchJob(${job.id},{balance_paid:this.checked})">
          Balance paid in full
        </label>
      </div>
      <div class="section-h">Invoices</div>
      <div class="invoice-row">
        <a class="btn btn-secondary btn-sm" href="/api/jobs/${job.id}/invoice/deposit" target="_blank">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Deposit Invoice
        </a>
        <a class="btn btn-primary btn-sm" href="/api/jobs/${job.id}/invoice/balance" target="_blank">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Balance Invoice
        </a>
      </div>
    </div>`:''}

    <!-- ACTIVITY -->
    <div id="t-activity" class="tab-pane" hidden>
      <div class="activity">
        ${(job.activity||[]).map(a=>`
          <div class="activity-entry">${esc(a.text)}
            <span class="activity-time">${fmtDateTime(a.created_at)}</span>
          </div>`).join('')}
      </div>
      <div class="note-add">
        <input id="noteInput" placeholder="Add a note…" onkeydown="if(event.key==='Enter')addNote(${job.id})">
        <button class="btn btn-primary btn-sm" onclick="addNote(${job.id})">Add</button>
      </div>
    </div>`;

  // Stage buttons
  const sr = body.querySelector('#sr-stage');
  STAGES.forEach(s => {
    const b = document.createElement('button');
    b.className = 'stage-btn' + (s.id===job.stage?' active':'');
    b.textContent = s.label;
    b.style.cssText = `background:${s.color}22;color:${s.color}`;
    b.onclick = () => moveStage(job.id, s.id);
    sr.appendChild(b);
  });

  // Assign buttons
  const ar = body.querySelector('#sr-assign');
  const ub = document.createElement('button');
  ub.className='stage-btn'+((!job.assigned_to)?' active':'');
  ub.textContent='Unassigned';
  ub.style.cssText='background:var(--border);color:var(--fg3)';
  ub.onclick=()=>patchJob(job.id,{assigned_to:''}).then(()=>refreshPanel(job.id));
  ar.appendChild(ub);
  people.forEach(p => {
    const b=document.createElement('button');
    b.className='stage-btn'+(job.assigned_to==p.id?' active':'');
    b.textContent=p.name;
    b.style.cssText=`background:${p.color}22;color:${p.color}`;
    b.onclick=()=>patchJob(job.id,{assigned_to:p.id}).then(()=>refreshPanel(job.id));
    ar.appendChild(b);
  });

  // Task checkboxes
  body.querySelectorAll('input[data-task]').forEach(cb => {
    cb.onchange = async () => {
      await api.patch(`/api/tasks/${cb.dataset.task}`, {done:cb.checked});
      const lbl = document.getElementById('lbl-'+cb.dataset.task);
      if(lbl) lbl.className = cb.checked ? 'task-label done' : 'task-label';
      await refreshJobs();
    };
  });
  body.querySelectorAll('select[data-task]').forEach(sel => {
    sel.onchange = async () => {
      await api.patch(`/api/tasks/${sel.dataset.task}`, {assigned_to:sel.value||null});
    };
  });

  document.getElementById('panelFooter').innerHTML = `
    <button class="btn btn-danger btn-sm" onclick="deleteJob(${job.id})">Delete Job</button>`;
}

function renderTasksHTML(job) {
  const tasksByStage = {};
  (job.tasks||[]).forEach(t => {
    if (!tasksByStage[t.stage]) tasksByStage[t.stage] = [];
    tasksByStage[t.stage].push(t);
  });
  let html = '';
  Object.entries(TASK_STAGES).forEach(([stageId, _]) => {
    const tasks = tasksByStage[stageId] || [];
    if (!tasks.length) return;
    const stage = STAGES.find(s=>s.id===stageId);
    const done = tasks.filter(t=>t.done).length;
    html += `<div class="section-h" style="color:${stage?.color}">${stage?.label} (${done}/${tasks.length})</div>
    <div class="task-list">`;
    tasks.forEach(t => {
      html += `<div class="task-item">
        <input type="checkbox" data-task="${t.id}" ${t.done?'checked':''}
          id="cb-${t.id}">
        <label id="lbl-${t.id}" class="task-label${t.done?' done':''}" for="cb-${t.id}">${esc(t.label)}</label>
        ${t.done&&t.done_at?`<span class="task-done-at">${fmtDateShort(t.done_at)}</span>`:''}
        <select class="task-assign-sel" data-task="${t.id}" style="width:auto;padding:2px 4px;font-size:11px;border-radius:4px;background:var(--bg);border:1px solid var(--border);color:var(--fg)">
          <option value="">—</option>
          ${people.map(p=>`<option value="${p.id}" ${t.assigned_to==p.id?'selected':''}>${p.name}</option>`).join('')}
        </select>
      </div>`;
    });
    html += '</div>';
  });
  return html || '<div class="empty">No tasks</div>';
}

function switchTab(btn, tabId) {
  const scope = btn.closest('.panel-body,.modal-body');
  scope.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  scope.querySelectorAll('.tab-pane').forEach(p=>p.hidden=true);
  document.getElementById(tabId).hidden=false;
}

// ── Team panel ─────────────────────────────────────────────────────────────
function toggleTeam() {
  showTeam = !showTeam;
  document.getElementById('teamPanel').hidden = !showTeam;
  if(showTeam) { closePanel(); renderTeam(); }
}
function closeTeam() { showTeam=false; document.getElementById('teamPanel').hidden=true; }

function renderTeam() {
  const body = document.getElementById('teamBody');
  let html = '';
  people.forEach(p => {
    const myJobs = jobs.filter(j=>j.stage!=='done'&&j.assigned_to==p.id);
    html += `<div class="person-card">
      <div class="person-header">
        <div class="person-avatar" style="background:${p.color}">${p.initials}</div>
        <div><div class="person-name">${p.name}</div><div class="person-role">${p.role} · ${myJobs.length} job${myJobs.length!==1?'s':''}</div></div>
      </div>
      <div class="person-jobs">
        ${myJobs.length ? myJobs.map(j=>{
          const s=STAGES.find(x=>x.id===j.stage);
          return `<div class="person-job-row" onclick="openPanel(${j.id})">
            <span class="pjr-ref">#${String(j.id).padStart(3,'0')}</span>
            <span class="pjr-name">${esc(j.customer_name)}</span>
            <span class="pjr-stage" style="color:${s?.color}">${s?.label||''}</span>
          </div>`;
        }).join('') : '<div class="empty" style="padding:10px">No active jobs</div>'}
      </div>
    </div>`;
  });
  body.innerHTML = html;
}

// ── Actions ───────────────────────────────────────────────────────────────
function openNewJob() {
  document.getElementById('newJobModal').hidden = false;
}
function closeNewJob() {
  document.getElementById('newJobModal').hidden = true;
}

async function saveNewJob() {
  const v = id => document.getElementById(id).value.trim();
  const customer_name = v('n-cust');
  if (!customer_name) { toast('Please enter a customer name'); return; }
  const body = {
    customer_name,
    customer_phone: v('n-phone'),
    customer_email: v('n-email'),
    trailer_type: v('n-type'),
    spec: v('n-spec'),
    notes: v('n-notes'),
    price: parseFloat(document.getElementById('n-price').value)||0,
    deposit_amount: parseFloat(document.getElementById('n-deposit').value)||0,
    deposit_paid: document.getElementById('n-deposited').checked,
    assigned_to: v('n-assign')||null,
    due_date: v('n-due')||null,
  };
  const { id } = await api.post('/api/jobs', body);
  closeNewJob();
  ['n-cust','n-phone','n-email','n-type','n-spec','n-notes','n-price','n-deposit','n-due'].forEach(x=>document.getElementById(x).value='');
  document.getElementById('n-deposited').checked=false;
  document.getElementById('n-assign').value='';
  await refreshJobs();
  toast('Job created');
  openPanel(id);
}

async function moveStage(jobId, stage) {
  await patchJob(jobId, {stage});
  await refreshJobs();
  refreshPanel(jobId);
}

async function patchJob(jobId, data) {
  await api.patch(`/api/jobs/${jobId}`, data);
  await refreshJobs();
}

async function addNote(jobId) {
  const inp = document.getElementById('noteInput');
  const text = inp.value.trim();
  if (!text) return;
  await api.post(`/api/jobs/${jobId}/notes`, {text});
  inp.value = '';
  refreshPanel(jobId);
}

async function deleteJob(jobId) {
  if (!confirm(`Delete job #${String(jobId).padStart(3,'0')}? This cannot be undone.`)) return;
  await api.delete(`/api/jobs/${jobId}`);
  closePanel();
  await refreshJobs();
  toast('Job deleted');
}

async function refreshJobs() {
  await loadJobs();
}

function getActiveTabId() {
  const btn = document.querySelector('#panelBody .tab-btn.active');
  if (!btn) return null;
  const m = btn.getAttribute('onclick').match(/'([^']+)'/);
  return m ? m[1] : null;
}

async function refreshPanel(jobId) {
  if (activeJobId !== jobId) return;
  const activeTab = getActiveTabId();
  const job = await api.get(`/api/jobs/${jobId}`);
  renderPanel(job);
  if (activeTab) {
    const btn = document.querySelector(`#panelBody .tab-btn[onclick*="${activeTab}"]`);
    if (btn) switchTab(btn, activeTab);
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtDate(d){if(!d)return'';const s=String(d).slice(0,10);return new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function fmtDateTime(d){if(!d)return'';return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2500);
}

function fmtDateShort(d){if(!d)return'';return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}

// ── Schedule calendar ──────────────────────────────────────────────────────
let showSchedule = false;
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth(); // 0-based

function toggleSchedule() {
  showSchedule = !showSchedule;
  document.getElementById('schedulePanel').style.display = showSchedule ? 'flex' : 'none';
  if (showSchedule) { closePanel(); closeTeam(); renderSchedule(); }
}
function closeSchedule() { showSchedule = false; document.getElementById('schedulePanel').style.display = 'none'; }
function shiftCalMonth(delta) { calMonth += delta; if (calMonth > 11){calMonth=0;calYear++;}else if(calMonth<0){calMonth=11;calYear--;} renderSchedule(); }
function goCalToday() { calYear=new Date().getFullYear(); calMonth=new Date().getMonth(); renderSchedule(); }

async function renderSchedule() {
  const body = document.getElementById('scheduleBody');
  body.innerHTML = '<div class="loader">Loading…</div>';
  const data = await api.get('/api/schedule');

  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('calMonthLabel').textContent = `${MONTHS[calMonth]} ${calYear}`;

  // Build lookup: dateStr -> [{job, type:'fab'|'fit'}]
  const byDate = {};
  const addChip = (dateStr, job, type) => {
    if (!dateStr) return;
    const d = String(dateStr).slice(0,10);
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push({job, type});
  };
  data.forEach(j => {
    if (['quote','fab'].includes(j.stage) && j.fab_date) addChip(j.fab_date, j, 'fab');
    if (['galv','order','fit'].includes(j.stage) && j.fitting_date) addChip(j.fitting_date, j, 'fit');
  });

  // Calendar grid: Mon–Sun (ISO week)
  const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const localDateStr = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const todayStr = localDateStr(new Date());

  // First day of month
  const firstDay = new Date(calYear, calMonth, 1);
  // Monday-based: 0=Mon…6=Sun
  let startDow = (firstDay.getDay() + 6) % 7; // getDay: 0=Sun
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const totalCells = Math.ceil((startDow + daysInMonth) / 7) * 7;

  let html = '<div class="cal-grid">';
  DOW.forEach(d => { html += `<div class="cal-dow">${d}</div>`; });

  for (let cell = 0; cell < totalCells; cell++) {
    const dayOffset = cell - startDow;
    const cellDate = new Date(calYear, calMonth, 1 + dayOffset);
    const isThisMonth = cellDate.getMonth() === calMonth;
    const dateStr = localDateStr(cellDate);
    const isToday = dateStr === todayStr;

    let cls = 'cal-day';
    if (!isThisMonth) cls += ' other-month';
    if (isToday) cls += ' today';

    html += `<div class="${cls}"><div class="cal-day-num">${cellDate.getDate()}</div>`;
    (byDate[dateStr] || []).forEach(({job, type}) => {
      const label = job.trailer_type ? `${esc(job.customer_name)} · ${esc(job.trailer_type)}` : esc(job.customer_name);
      html += `<span class="cal-chip ${type}" onclick="closeSchedule();openPanel(${job.id})" title="${esc(job.customer_name)}">${label}</span>`;
    });
    html += '</div>';
  }
  html += '</div>';
  body.innerHTML = html;
}

// ── Admin ─────────────────────────────────────────────────────────────────
function toggleAdmin() {
  if (isAdmin) {
    isAdmin = false;
    document.getElementById('adminLabel').textContent = 'Admin';
    document.getElementById('adminBtn').style.background = '';
    render();
    if (activeJobId) refreshPanel(activeJobId);
    toast('Admin mode off');
  } else {
    document.getElementById('adminPin').value = '';
    document.getElementById('adminModal').hidden = false;
    setTimeout(()=>document.getElementById('adminPin').focus(), 100);
  }
}

async function verifyAdmin() {
  const pin = document.getElementById('adminPin').value;
  const { ok } = await api.post('/api/admin/verify', { pin });
  if (ok) {
    isAdmin = true;
    document.getElementById('adminModal').hidden = true;
    document.getElementById('adminLabel').textContent = 'Admin ✓';
    document.getElementById('adminBtn').style.background = 'rgba(255,255,255,.25)';
    render();
    if (activeJobId) refreshPanel(activeJobId);
    toast('Admin mode on');
  } else {
    toast('Wrong PIN');
    document.getElementById('adminPin').value = '';
    document.getElementById('adminPin').focus();
  }
}

// ── Archive ───────────────────────────────────────────────────────────────
async function switchView(archived) {
  showArchived = archived;
  document.getElementById('vbActive').classList.toggle('active', !archived);
  document.getElementById('vbArchived').classList.toggle('active', archived);
  closePanel();
  await loadJobs();
}

async function archiveJob(jobId) {
  if (!confirm('Archive this job? It will be hidden from the main board.')) return;
  await api.patch(`/api/jobs/${jobId}`, { archived: true });
  closePanel();
  await loadJobs();
  toast('Job archived');
}

// ── Ordering warning ──────────────────────────────────────────────────────
function hasOrderingWarning(job) {
  if (['done','ready','quote','fab','galv'].includes(job.stage)) return false;
  const orderTasks = (job.tasks||[]).filter(t=>t.stage==='order');
  return orderTasks.some(t=>!t.done);
}

function orderingWarning(job) {
  if (!hasOrderingWarning(job)) return '';
  const orderTasks = (job.tasks||[]).filter(t=>t.stage==='order');
  const unfinished = orderTasks.filter(t=>!t.done).length;
  return `<div class="warn-banner">📦 ${unfinished} purchased item${unfinished>1?'s':''} not yet ticked off</div>`;
}

// ── Extras ────────────────────────────────────────────────────────────────
async function saveExtras(jobId) {
  const val = document.getElementById('ov-extras')?.value ?? null;
  await api.patch(`/api/jobs/${jobId}`, { extras: val || null });
}

// ── Galv list ─────────────────────────────────────────────────────────────
let galvData = [];

async function openGalvList() {
  document.getElementById('galvModal').hidden = false;
  document.getElementById('galvBody').innerHTML = '<div class="loader">Loading…</div>';
  galvData = await api.get('/api/galv/pending');

  // group by job
  const byJob = {};
  galvData.forEach(r => {
    if (!byJob[r.id]) byJob[r.id] = { id:r.id, name:r.customer_name, trailer:r.trailer_type, spec:r.spec, tasks:[] };
    byJob[r.id].tasks.push(r);
  });

  if (!Object.keys(byJob).length) {
    document.getElementById('galvBody').innerHTML = '<div class="empty">No jobs currently at galvanising stage.</div>';
    return;
  }

  let html = '<p style="font-size:12px;color:var(--fg2);margin-bottom:12px">Tick items to include in this send, then click Print / Save PDF.</p>';
  Object.values(byJob).forEach(j => {
    html += `<div style="margin-bottom:14px">
      <div style="font-weight:700;font-size:13px;margin-bottom:6px">JOB #${String(j.id).padStart(3,'0')} · ${esc(j.name)} <span style="font-weight:400;color:var(--fg2)">${esc(j.trailer||'')}${j.spec?' · '+esc(j.spec):''}</span></div>`;
    j.tasks.forEach(t => {
      html += `<div class="galv-item">
        <input type="checkbox" class="galv-cb" data-job="${j.id}" data-task="${t.task_id}" data-label="${esc(t.label)}" data-name="${esc(j.name)}" data-ref="JOB #${String(j.id).padStart(3,'0')}" ${t.done?'checked':''}>
        <span>${esc(t.label)}</span>
        ${t.done_at?`<span class="task-done-at" style="margin-left:auto">Done ${fmtDateShort(t.done_at)}</span>`:''}
      </div>`;
    });
    html += '</div>';
  });
  document.getElementById('galvBody').innerHTML = html;
}

function printGalvList() {
  const checked = [...document.querySelectorAll('.galv-cb:checked')];
  if (!checked.length) { toast('Tick at least one item'); return; }
  const lines = checked.map(cb => `${cb.dataset.ref} · ${cb.dataset.name} — ${cb.dataset.label}`);
  const date = new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  const win = window.open('','_blank');
  win.document.write(`<!DOCTYPE html><html><head><title>KPC Galvanising Send List</title>
  <style>body{font-family:Arial,sans-serif;padding:30px;color:#111}h1{font-size:18px;margin-bottom:4px}p{font-size:12px;color:#666;margin-bottom:20px}li{font-size:14px;padding:6px 0;border-bottom:1px solid #eee;list-style:none}@media print{button{display:none}}</style></head>
  <body><h1>KPC Engineering · Galvanising Send List</h1><p>Prepared: ${date}</p><ul>${lines.map(l=>`<li>${l}</li>`).join('')}</ul>
  <p style="margin-top:20px;font-size:12px;color:#666">${lines.length} item${lines.length>1?'s':''} total</p>
  <button onclick="window.print()" style="margin-top:20px;padding:8px 16px;cursor:pointer">Print</button></body></html>`);
  win.document.close();
  win.focus();
  win.print();
}
